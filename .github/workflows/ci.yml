name: Drift release gate

on:
  push:
  pull_request:

jobs:
  compatibility:
    strategy:
      fail-fast: false
      matrix:
        node: [18, 20, 22]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: corepack enable
      - run: corepack prepare pnpm@8.15.0 --activate
      - run: pnpm install --frozen-lockfile
      - run: node scripts/release-check.mjs --typecheck --test --build --budgets

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - run: corepack enable
      - run: corepack prepare pnpm@8.15.0 --activate
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: node scripts/release-check.mjs --build --budgets --e2e
        env:
          CI: true
