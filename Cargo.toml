[workspace]
members = ["crates/drift-ir", "crates/drift-kernel"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/ciphrnotfound/drift"
rust-version = "1.93"

[workspace.dependencies]
axum = "0.8.9"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
thiserror = "2.0.17"
tokio = { version = "1.48.0", features = ["macros", "net", "rt-multi-thread"] }

[workspace.lints.rust]
unsafe_code = "forbid"
